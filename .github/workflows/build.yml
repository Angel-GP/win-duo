name: build

# 在 Windows runner 上把 win-duo 打包成单文件 exe。
# 产物 artifact 名为 win-duo (dist/win-duo.exe)。

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # bettercam 的 DXGI 备选实现 (build_exe.py 里 --hidden-import 了它)
          pip install dxcam
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          python scripts\build_exe.py --clean

      - name: Show result
        shell: pwsh
        run: |
          if (-not (Test-Path dist\win-duo.exe)) {
            Write-Error "dist\win-duo.exe not found"
            exit 1
          }
          Get-Item dist\win-duo.exe | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-duo
          path: dist/win-duo.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/win-duo.exe
